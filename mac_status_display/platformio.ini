; USB-only Mac status screen: ESP8266 NodeMCU v2 + 240x240 ST7789

[platformio]
default_envs = esp12e

[env:esp12e]
platform = espressif8266@2.6.3
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
	-D USER_SETUP_LOADED=1
	-D ST7789_2_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=240
	-D TFT_CS=15
	-D TFT_DC=0
	-D TFT_RST=2
	-D TFT_BL=5
	-D TOUCH_CS=-1
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D SPI_FREQUENCY=27000000
	-Wall
	-Wextra
	-Wno-deprecated-declarations

lib_deps =
	bodmer/TFT_eSPI@2.5.43

[env:native_test]
platform = native
test_build_src = no
test_framework = unity
build_flags =
	-std=c++11
	-Wall
	-Wextra
	-Werror
